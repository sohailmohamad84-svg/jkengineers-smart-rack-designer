services:
  - type: web
    name: jkengineers-designer
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: mock
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: JK Engineers Works
      - key: NEXT_PUBLIC_COMPANY_PHONE
        value: +91 7942546295
      - key: NEXT_PUBLIC_COMPANY_EMAIL
        value: info@jkengineersworks.com
      - key: NEXT_PUBLIC_COMPANY_LOCATION
        value: Mumbai, Maharashtra, India
